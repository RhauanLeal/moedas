{% if m.descricao %}<span class="chip publico{% if m.qtd %} tenho {{ m.metal }}{% endif %}"><span class="marca-ok" aria-hidden="true"></span><span class="ano">{{ m.ano_rotulo }}</span><span class="desc">{{ m.descricao }}</span>{% if m.qtd > 1 %}<span class="qtd">×{{ m.qtd }}</span>{% endif %}</span>
{% else %}<span class="chip publico{% if m.qtd %} tenho {{ m.metal }}{% endif %}">{{ m.ano_rotulo }}{% if m.qtd > 1 %}<span class="qtd">{{ m.qtd }}</span>{% endif %}</span>{% endif %}
