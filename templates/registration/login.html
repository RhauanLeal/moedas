{% extends "base.html" %}
{% block titulo %}Entrar · Moedas do Real{% endblock %}
{% block conteudo %}
<div class="login">
  <h1>Moedas do Real</h1>
  <p class="vazio" style="padding:0">Controle da coleção do Plano Real.</p>
  {% if form.errors %}<p class="erro">Usuário ou senha incorretos.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Usuário</label>
    <input id="id_username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="id_password">Senha</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
