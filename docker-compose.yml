services:
  moedas:
    build: .
    container_name: moedas
    env_file: .env
    ports:
      - "127.0.0.1:${PORTA:-8030}:8000"
    restart: unless-stopped
    # Permite acessar serviços do próprio computador/VM via host.docker.internal
    # (em dev, o banco é alcançado pelo túnel SSH: DB_HOST=host.docker.internal, DB_PORT=<porta do túnel>)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Fotos enviadas pelos usuários (sobrevivem a rebuilds; entram no backup)
    volumes:
      - media:/app/media

volumes:
  media:
